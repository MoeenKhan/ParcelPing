name: Build

# Called by ci.yml. Lints, tests, builds and smoke-tests ParcelPing.exe, and
# publishes it as a GitHub release when given a release tag.
on:
  workflow_call:
    inputs:
      release-tag:
        description: Tag to publish as a release (e.g. v1.0.1); empty = build only
        type: string
        default: ""

jobs:
  build:
    name: Lint, test, build and smoke-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check . --output-format github

      - name: Test
        run: python -m pytest -q

      - name: Build ParcelPing.exe
        run: python build.py

      - name: Smoke-test the .exe
        run: python scripts/smoke_test.py dist/ParcelPing.exe

      - name: Checksum
        shell: bash
        run: cd dist && sha256sum ParcelPing.exe > ParcelPing.exe.sha256 && cat ParcelPing.exe.sha256

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          # PR refs contain "/", which artifact names can't, so use the run number.
          name: ${{ inputs.release-tag && format('ParcelPing-{0}', inputs.release-tag) || format('ParcelPing-build-{0}', github.run_number) }}
          path: |
            dist/ParcelPing.exe
            dist/ParcelPing.exe.sha256
          retention-days: ${{ inputs.release-tag && 90 || 14 }}
          if-no-files-found: error

      - name: Publish GitHub release ${{ inputs.release-tag }}
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          flags=""
          # Versions like 1.1.0-beta.1 become pre-releases, so "latest" stays stable.
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # Creates the tag on this commit as part of the release.
          gh release create "$TAG" \
            dist/ParcelPing.exe dist/ParcelPing.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ParcelPing ${TAG#v}" \
            --generate-notes \
            $flags
