name: Build

# Shared by ci.yml (every push and pull request) and release.yml (version
# tags), so a release is built exactly the way CI builds every commit.
on:
  workflow_call:
    inputs:
      release:
        description: Publish a GitHub release for the pushed tag
        type: boolean
        default: false

jobs:
  build:
    name: Lint, test, build and smoke-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check the tag matches the app version
        if: inputs.release
        shell: bash
        run: |
          app_version=$(python -c "import app; print(app.__version__)")
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/__init__.py version $app_version"
            exit 1
          fi

      - name: Lint
        run: python -m ruff check . --output-format github

      - name: Test
        run: python -m pytest -q

      - name: Build ParcelPing.exe
        run: python build.py

      - name: Smoke-test the .exe
        run: python scripts/smoke_test.py dist/ParcelPing.exe

      - name: Checksum
        shell: bash
        run: cd dist && sha256sum ParcelPing.exe > ParcelPing.exe.sha256 && cat ParcelPing.exe.sha256

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          # PR refs contain "/", which artifact names can't, so CI builds use the run number.
          name: ${{ inputs.release && format('ParcelPing-{0}', github.ref_name) || format('ParcelPing-build-{0}', github.run_number) }}
          path: |
            dist/ParcelPing.exe
            dist/ParcelPing.exe.sha256
          retention-days: ${{ inputs.release && 90 || 14 }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Tags like v1.1.0-beta.1 become pre-releases, so "latest" stays stable.
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            dist/ParcelPing.exe dist/ParcelPing.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "ParcelPing ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $flags
