name: Release

# Push a tag like v1.0.1 (matching app/__init__.py) to build, test and
# publish ParcelPing.exe as a GitHub release. See "Releasing" in README.md.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    permissions:
      contents: write  # create the release and upload the .exe
