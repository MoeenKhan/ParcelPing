name: Release

# Push a tag like v1.0.0 to build ParcelPing.exe and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt

      - name: Check tag matches app version
        shell: bash
        run: |
          app_version=$(python -c "import app; print(app.__version__)")
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app/__init__.py version $app_version"
            exit 1
          fi

      - run: python -m pytest -q
      - run: python build.py

      - name: Checksum
        shell: bash
        run: cd dist && sha256sum ParcelPing.exe > ParcelPing.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ParcelPing.exe
            dist/ParcelPing.exe.sha256
          generate_release_notes: true
