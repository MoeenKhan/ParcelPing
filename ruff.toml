target-version = "py312"
line-length = 110
extend-exclude = ["venv", "build", "dist"]

[lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E402",   # tests set Qt/env options before importing the app
    "E501",   # long stylesheet and status-table lines read better unwrapped
    "UP031",  # SQL placeholders are built with % on purpose
    "UP042",  # StrEnum would change how stored stage values are formatted
]
